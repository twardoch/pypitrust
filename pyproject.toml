# this_file: pyproject.toml
[project]
name = "pypitrust"
dynamic = ["version"]
description = "Set up PyPI Trusted Publishing for GitHub repos: the GitHub side through gh, the PyPI side through a real browser."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["pypi", "trusted-publishing", "oidc", "github-actions", "release", "hatch-vcs"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Software Distribution",
]
dependencies = ["fire>=0.7", "rich>=13", "loguru>=0.7", "playwrightauthor>=1.0.26"]

[project.urls]
Homepage = "https://github.com/twardoch/pypitrust"
Issues = "https://github.com/twardoch/pypitrust/issues"
Changelog = "https://github.com/twardoch/pypitrust/blob/main/CHANGELOG.md"

[project.scripts]
pypitrust = "pypitrust.cli:main"

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/pypitrust/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pypitrust"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
